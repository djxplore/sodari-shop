<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sodari Shop - Verified Only</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #38bdf8; --bg-gradient: radial-gradient(circle at top right, #0f172a, #020617); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-gradient); color: white; overflow-x: hidden; min-height: 100vh; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
        .nav-btn { color: #64748b; transition: 0.3s; display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 700; }
        .nav-active { color: var(--primary); transform: translateY(-3px); }
        .hidden { display: none !important; }
        input { color: white !important; background: rgba(15, 23, 42, 0.6) !important; border: 1px solid rgba(51, 65, 85, 1) !important; outline: none; transition: 0.3s; }
        input:focus { border-color: #38bdf8 !important; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
        .product-card { transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(255,255,255,0.05); }
        .product-card:active { transform: scale(0.96); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-grad { background: linear-gradient(to right, #0ea5e9, #38bdf8); }
    </style>
</head>
<body>

    <div id="splash" class="fixed inset-0 bg-[#020617] flex flex-col items-center justify-center z-[10000]">
        <div class="w-16 h-16 bg-sky-500 rounded-2xl rotate-45 flex items-center justify-center animate-bounce text-white font-black text-2xl">S</div>
        <p class="mt-8 text-sky-400 font-bold tracking-widest animate-pulse uppercase">Verified Sodari Shop</p>
    </div>

    <!-- AUTH SECTION: REGISTER & LOGIN -->
    <div id="auth-section" class="min-h-screen flex items-center justify-center p-6 hidden text-center">
        <div class="glass w-full max-w-sm p-8 rounded-[2.5rem] shadow-2xl">
            <h2 id="auth-title" class="text-3xl font-extrabold mb-1 uppercase tracking-tighter">Welcome</h2>
            <p id="auth-desc" class="text-slate-400 text-[10px] mb-8 font-bold uppercase tracking-widest">Register to enter shop</p>
            
            <div id="register-fields" class="space-y-4 text-left">
                <input type="text" id="reg-name" class="w-full p-4 rounded-xl" placeholder="Full Name (First & Last)">
                <input type="email" id="reg-email" class="w-full p-4 rounded-xl" placeholder="Your Gmail Address">
                <input type="number" id="reg-phone" class="w-full p-4 rounded-xl" placeholder="10-Digit Mobile Number">
                <input type="text" id="reg-address" class="w-full p-4 rounded-xl" placeholder="Complete Delivery Address">
            </div>

            <div id="login-fields" class="space-y-4 text-left hidden">
                <input type="number" id="login-phone" class="w-full p-4 rounded-xl" placeholder="Registered Mobile Number">
            </div>
            
            <button onclick="handleAuthSubmit()" id="auth-main-btn" class="w-full bg-sky-500 p-4 rounded-xl font-black text-white shadow-lg active:scale-95 transition uppercase mt-6 tracking-widest">Get Verification Code</button>
            
            <p id="auth-toggle-msg" class="mt-6 text-xs text-slate-500 uppercase font-bold">
                Already have an account? <span onclick="toggleAuthMode('login')" class="text-sky-400 underline cursor-pointer">Login Here</span>
            </p>
        </div>
    </div>

    <!-- OTP SECTION -->
    <div id="otp-section" class="min-h-screen flex items-center justify-center p-6 hidden text-center">
        <div class="glass w-full max-w-sm p-8 rounded-[2.5rem] border border-sky-500/30">
            <h2 class="text-2xl font-black mb-2 uppercase">Verify OTP</h2>
            <p id="otp-msg" class="text-slate-400 text-xs mb-8"></p>
            <div class="space-y-4">
                <input type="number" id="otp-input" class="w-full p-5 rounded-xl text-center text-3xl font-bold tracking-[8px]" placeholder="000000">
                <button onclick="verifyOTP()" id="verify-btn" class="w-full bg-green-500 p-4 rounded-xl font-black text-white shadow-lg active:scale-95 transition">ACTIVATE & ENTER</button>
                <p onclick="location.reload()" class="text-slate-500 text-[10px] uppercase font-bold underline cursor-pointer mt-4">Cancel & Go Back</p>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="main-app" class="hidden">
        <header class="p-5 flex justify-between items-center glass sticky top-0 z-50">
            <div><p class="text-[10px] text-sky-400 font-black uppercase tracking-widest">Namaste,</p><h1 id="header-user-name" class="font-extrabold text-lg truncate max-w-[150px]">Guest</h1></div>
            <div onclick="showPage('profile')" class="w-10 h-10 bg-sky-500 rounded-xl flex items-center justify-center font-black" id="nav-initial">S</div>
        </header>
        
        <div id="page-shop" class="page-content p-4 pb-32">
            <div class="mb-6 p-6 bg-gradient-to-br from-blue-600 to-sky-500 rounded-[2rem] shadow-xl">
                <h2 class="text-2xl font-black uppercase tracking-widest">Official <br>Sodari Shop</h2>
            </div>
            <div id="product-list" class="grid grid-cols-2 gap-4"></div>
        </div>

        <div id="page-history" class="page-content p-4 hidden pb-32 text-center"><h2 class="text-2xl font-extrabold mb-6 uppercase">Order Status</h2><div id="order-history" class="space-y-4"></div></div>
        
        <div id="page-profile" class="page-content p-6 hidden pb-32 text-center">
             <div class="glass p-8 rounded-[2.5rem] mb-6 border-white/5 shadow-xl">
                <div class="w-20 h-20 bg-sky-500 rounded-3xl mx-auto mb-4 flex items-center justify-center text-3xl font-black shadow-xl" id="prof-initial">S</div>
                <h3 id="prof-name" class="text-xl font-bold uppercase tracking-tight">...</h3>
                <p id="prof-email" class="text-sky-400 text-[10px] font-bold mb-1"></p>
                <p id="prof-phone" class="text-slate-400 text-xs font-bold"></p>
                <p id="prof-address" class="text-slate-500 text-[9px] mt-2 uppercase"></p>
            </div>
            <button onclick="logout()" class="w-full bg-red-500/10 text-red-500 p-5 rounded-2xl font-black border border-red-500/20 uppercase tracking-widest">Logout Account</button>
        </div>

        <nav class="fixed bottom-0 w-full glass flex justify-around p-4 rounded-t-[2.5rem] z-[1000] border-t border-white/10 shadow-2xl">
            <button onclick="showPage('shop')" id="btn-shop" class="nav-btn nav-active">🏠<span>Home</span></button>
            <button onclick="showPage('history')" id="btn-history" class="nav-btn">📦<span>Orders</span></button>
            <button onclick="showPage('profile')" id="btn-profile" class="nav-btn">👤<span>Profile</span></button>
        </nav>
    </div>

    <!-- PAYMENT MODAL -->
    <div id="payment-modal" class="fixed inset-0 hidden flex items-center justify-center p-4 bg-black/95 z-[9999]">
        <div class="glass dialog-content w-full max-w-sm p-6 rounded-[2.5rem] shadow-2xl border border-sky-500/30 overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-black text-sky-400 uppercase">Secure Pay</h3><button onclick="togglePaymentModal(false)" class="text-slate-400">✕</button></div>
            <div class="bg-blue-600/10 p-4 rounded-2xl text-center mb-4 text-white"><h2 id="pay-amt" class="text-3xl font-black">Rs. 0</h2></div>
            <div class="bg-white p-4 rounded-2xl mb-4 flex flex-col items-center">
                <img id="dynamic-qr" src="" class="w-60 h-60 rounded-lg">
                <p class="text-[12px] text-slate-900 font-bold mt-2 uppercase">SONAM TASHI</p>
            </div>
            <div class="space-y-4 mb-4">
                <input type="file" id="pay-img" accept="image/*" class="w-full text-xs text-slate-400">
                <input type="text" id="pay-utr" placeholder="Transaction ID (UTR)" class="w-full p-4 bg-slate-950 border border-slate-700 rounded-xl text-center uppercase font-mono text-white outline-none">
            </div>
            <button onclick="confirmOrder()" id="confirm-btn" class="w-full bg-sky-500 p-4 rounded-xl font-black text-white shadow-lg uppercase">Confirm Payment</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATIONS (VITAL) ---
        const SERVICE_ID = "service_ayu880i";
        const TEMPLATE_ID = "template_9y1rbhq";
        const PUBLIC_KEY = "iPOwwrMm5Sf2UrudJ";

        const firebaseConfig = { 
            apiKey: "AIzaSyCPfeQuHLUciwDha9g2y3_Wc4eLvjjkxW4", 
            databaseURL: "https://sodari-online-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        (function(){ emailjs.init(PUBLIC_KEY); })();

        let generatedOTP = null;
        let userDataTemp = null;
        let currentAuthMode = 'register'; 
        let currentUser = JSON.parse(localStorage.getItem('sodari_active_user'));
        let selectedProduct = null;

        // --- 2. AUTH UI & LOGIC ---
        function toggleAuthMode(mode) {
            currentAuthMode = mode;
            const regFields = document.getElementById('register-fields');
            const loginFields = document.getElementById('login-fields');
            const title = document.getElementById('auth-title');
            const desc = document.getElementById('auth-desc');
            const toggleMsg = document.getElementById('auth-toggle-msg');

            if (mode === 'login') {
                regFields.classList.add('hidden'); loginFields.classList.remove('hidden');
                title.innerText = "Login"; desc.innerText = "Verification required to login";
                toggleMsg.innerHTML = `New User? <span onclick="toggleAuthMode('register')" class="text-sky-400 underline cursor-pointer">Register Here</span>`;
            } else {
                regFields.classList.remove('hidden'); loginFields.classList.add('hidden');
                title.innerText = "Welcome"; desc.innerText = "Register to enter shop";
                toggleMsg.innerHTML = `Already have account? <span onclick="toggleAuthMode('login')" class="text-sky-400 underline cursor-pointer">Login Here</span>`;
            }
        }

        function handleAuthSubmit() {
            if (currentAuthMode === 'register') {
                const name = document.getElementById('reg-name').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const phone = document.getElementById('reg-phone').value.trim();
                const address = document.getElementById('reg-address').value.trim();
                if (!name || !email || !phone || !address) return alert("Fill all details!");
                if (!/^[6-9]\d{9}$/.test(phone)) return alert("Enter real 10-digit number.");
                db.ref('users/' + phone).once('value', snap => {
                    if (snap.exists()) { alert("Number already exists!"); toggleAuthMode('login'); }
                    else { startOTP(name, email, phone, address); }
                });
            } else {
                const phone = document.getElementById('login-phone').value.trim();
                if (!phone) return alert("Enter registered phone!");
                db.ref('users/' + phone).once('value', snap => {
                    if (snap.exists()) { const u = snap.val(); startOTP(u.name, u.email, u.phone, u.address); }
                    else { alert("User not found!"); toggleAuthMode('register'); }
                });
            }
        }

        function startOTP(name, email, phone, address) {
            const btn = document.getElementById('auth-main-btn'); btn.innerText = "Connecting..."; btn.disabled = true;
            generatedOTP = Math.floor(100000 + Math.random() * 900000);
            userDataTemp = { name: name.toUpperCase(), email, phone, address: address.toUpperCase() };
            emailjs.send(SERVICE_ID, TEMPLATE_ID, { to_name: name, email: email, passcode: generatedOTP })
                .then(() => {
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('otp-section').classList.remove('hidden');
                    document.getElementById('otp-msg').innerText = "6-Digit code sent to " + email;
                }, (err) => { alert("Email error! Check keys."); btn.disabled = false; });
        }

        function verifyOTP() {
            if (document.getElementById('otp-input').value == generatedOTP) {
                db.ref('users/' + userDataTemp.phone).set(userDataTemp).then(() => loginUser(userDataTemp));
            } else { alert("Wrong Code!"); }
        }

        function loginUser(u) {
            localStorage.setItem('sodari_active_user', JSON.stringify(u));
            currentUser = u;
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('otp-section').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            initUI();
        }

        function logout() { localStorage.clear(); location.reload(); }

        // --- 3. SHOP & PRODUCT UI ---
        function initUI() {
            document.getElementById('header-user-name').innerText = currentUser.name;
            document.getElementById('prof-name').innerText = currentUser.name;
            document.getElementById('prof-email').innerText = currentUser.email;
            document.getElementById('prof-phone').innerText = "📞 " + currentUser.phone;
            document.getElementById('prof-address').innerText = "📍 " + currentUser.address;
            const init = currentUser.name[0].toUpperCase();
            document.getElementById('nav-initial').innerText = init;
            document.getElementById('prof-initial').innerText = init;
            loadProducts(); showPage('shop');
        }

        function loadProducts() {
            db.ref('products').on('value', snap => {
                const list = document.getElementById('product-list'); list.innerHTML = "";
                snap.forEach(child => {
                    const p = child.val();
                    const card = document.createElement('div');
                    card.className = "glass p-2 rounded-[2rem] product-card flex flex-col h-full";
                    card.innerHTML = `
                        <div class="w-full h-44 overflow-hidden rounded-[1.5rem] mb-3 bg-black/20">
                            <img src="${p.img}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex flex-col flex-1 px-1">
                            <h3 class="font-bold text-xs text-white leading-tight mb-2 line-clamp-2 uppercase min-h-[2.5rem]">${p.name}</h3>
                            <div class="mt-auto flex justify-between items-end pb-1">
                                <div class="flex flex-col">
                                    <span class="text-[8px] text-slate-500 font-bold uppercase">Price</span>
                                    <span class="text-sky-400 font-black text-sm">Rs. ${p.price}</span>
                                </div>
                                <button class="btn-grad text-white text-[10px] font-black px-4 py-2 rounded-xl uppercase tracking-tighter shadow-lg">Buy</button>
                            </div>
                        </div>`;
                    card.onclick = () => { selectedProduct = { ...p, id: child.key }; togglePaymentModal(true); };
                    list.appendChild(card);
                });
            });
        }

        function togglePaymentModal(s) {
            if(s) {
                const amt = selectedProduct.price;
                document.getElementById('pay-amt').innerText = "Rs. " + amt;
                const upi = `upi://pay?pa=9906928968@pnb&pn=SONAM TASHI&am=${amt}&cu=INR`;
                document.getElementById('dynamic-qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(upi)}`;
            }
            document.getElementById('payment-modal').classList.toggle('hidden', !s);
        }

        function confirmOrder() {
            const utr = document.getElementById('pay-utr').value.trim();
            const file = document.getElementById('pay-img').files[0];
            if(!file || !utr) return alert("Proof and UTR ID required!");

            const btn = document.getElementById('confirm-btn'); btn.innerText = "Sending Order..."; btn.disabled = true;
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = { 
                    item: selectedProduct.name, 
                    price: selectedProduct.price, 
                    downloadLink: selectedProduct.link || "", // Syncs with Admin's Link
                    userName: currentUser.name, 
                    userEmail: currentUser.email, 
                    userPhone: currentUser.phone, 
                    userAddress: currentUser.address,
                    utr: utr.toUpperCase(), 
                    proofImg: e.target.result, 
                    status: 'Reviewing', 
                    time: new Date().toLocaleString() 
                };
                db.ref('orders').push(data).then(() => {
                    alert("Order Placed Successfully!"); togglePaymentModal(false); showPage('history');
                    btn.innerText = "Confirm Payment"; btn.disabled = false;
                });
            };
            reader.readAsDataURL(file);
        }

        function showPage(pId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
            document.getElementById('page-' + pId).classList.remove('hidden');
            document.getElementById('btn-' + pId).classList.add('nav-active');
            if(pId === 'history') loadOrders();
        }

        function loadOrders() {
            db.ref('orders').on('value', snap => {
                const hist = document.getElementById('order-history'); hist.innerHTML = "";
                snap.forEach(child => {
                    const o = child.val();
                    if(o.userPhone === currentUser.phone) {
                        let downloadBtn = "";
                        // SHOWS DOWNLOAD BUTTON ONLY IF ADMIN ACCEPTS
                        if(o.status === 'Accepted' && o.downloadLink) {
                            downloadBtn = `<a href="${o.downloadLink}" target="_blank" class="block w-full bg-green-500 text-white text-center p-3 rounded-xl font-black mt-3 uppercase text-[10px] shadow-lg">📥 Download Now</a>`;
                        }

                        hist.innerHTML = `
                        <div class="glass p-5 rounded-3xl mb-4 text-left border-white/5 shadow-lg">
                            <div class="flex justify-between mb-2 text-[10px] font-bold uppercase">
                                <h4>${o.item}</h4>
                                <span class="${o.status === 'Accepted' ? 'text-green-400' : (o.status === 'Rejected' ? 'text-red-500' : 'text-sky-400')}">${o.status}</span>
                            </div>
                            <p class="text-sky-400 font-black text-lg">Rs. ${o.price}</p>
                            ${downloadBtn}
                            <p class="text-[9px] text-slate-500 mt-2">${o.time}</p>
                        </div>` + hist.innerHTML;
                    }
                });
            });
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash').classList.add('hidden');
                if(currentUser) loginUser(currentUser);
                else document.getElementById('auth-section').classList.remove('hidden');
            }, 1500);
        };
    </script>
</body>
</html>
